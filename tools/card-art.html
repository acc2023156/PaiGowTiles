<!doctype html>
<!-- 大廳卡片圖原稿：用瀏覽器無頭模式截成 256×256 透明 PNG（見 README） -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a52"/><stop offset=".45" stop-color="#18181c"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e7c2"/><stop offset="1" stop-color="#b89a5a"/>
    </linearGradient>
    <radialGradient id="w" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9c9c9"/></radialGradient>
    <radialGradient id="r" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ff7b88"/><stop offset="1" stop-color="#c30f28"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd76a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/><stop offset=".35" stop-color="#ffd23f"/><stop offset=".7" stop-color="#f39a00"/><stop offset="1" stop-color="#c96a00"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27e0c0" stop-opacity="0"/><stop offset=".5" stop-color="#3ff5d4"/><stop offset="1" stop-color="#27e0c0" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/></filter>
    <g id="tile">
      <rect x="-26" y="-50" width="52" height="104" rx="9" fill="url(#side)"/>
      <rect x="-26" y="-54" width="52" height="102" rx="9" fill="url(#body)" stroke="#000" stroke-width="1.5"/>
      <rect x="-22" y="-51" width="44" height="16" rx="7" fill="#fff" opacity=".13"/>
      <line x1="-16" y1="-3" x2="16" y2="-3" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
    </g>
  </defs>

  <circle cx="128" cy="100" r="104" fill="url(#glow)"/>
  <ellipse cx="128" cy="112" rx="112" ry="40" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-14 128 112)"/>

  <!-- 左：至尊 二四 -->
  <g filter="url(#sh)" transform="translate(70 100) rotate(-18)">
    <use href="#tile"/>
    <circle cx="-8" cy="-37" r="6" fill="url(#w)"/><circle cx="8" cy="-19" r="6" fill="url(#w)"/>
    <circle cx="-10" cy="12" r="6" fill="url(#r)"/><circle cx="10" cy="12" r="6" fill="url(#r)"/>
    <circle cx="-10" cy="32" r="6" fill="url(#r)"/><circle cx="10" cy="32" r="6" fill="url(#r)"/>
  </g>
  <!-- 右：天牌 -->
  <g filter="url(#sh)" transform="translate(186 100) rotate(18)">
    <use href="#tile"/>
    <circle cx="-10" cy="-42" r="5" fill="url(#r)"/><circle cx="10" cy="-42" r="5" fill="url(#w)"/>
    <circle cx="-10" cy="-28" r="5" fill="url(#r)"/><circle cx="10" cy="-28" r="5" fill="url(#w)"/>
    <circle cx="-10" cy="-14" r="5" fill="url(#r)"/><circle cx="10" cy="-14" r="5" fill="url(#w)"/>
    <circle cx="-10" cy="8" r="5" fill="url(#r)"/><circle cx="10" cy="8" r="5" fill="url(#w)"/>
    <circle cx="-10" cy="22" r="5" fill="url(#r)"/><circle cx="10" cy="22" r="5" fill="url(#w)"/>
    <circle cx="-10" cy="36" r="5" fill="url(#r)"/><circle cx="10" cy="36" r="5" fill="url(#w)"/>
  </g>
  <!-- 中：丁三（至尊寶） -->
  <g filter="url(#sh)" transform="translate(128 84) scale(1.12)">
    <use href="#tile"/>
    <circle cx="0" cy="-28" r="9" fill="url(#r)"/>
    <circle cx="-11" cy="6" r="5.5" fill="url(#w)"/><circle cx="0" cy="19" r="5.5" fill="url(#w)"/><circle cx="11" cy="32" r="5.5" fill="url(#w)"/>
  </g>

  <!-- 閃光 -->
  <g fill="#fff7c9">
    <path d="M28 52 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M226 40 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z"/>
    <path d="M232 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M40 158 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z"/>
  </g>

  <!-- 標題 -->
  <g font-family="'Microsoft JhengHei','Noto Sans TC','PingFang TC',sans-serif" font-weight="900" font-size="64" text-anchor="middle">
    <text x="128" y="226" fill="#0a3b3a" stroke="#0a3b3a" stroke-width="16" stroke-linejoin="round">黑粒仔</text>
    <text x="128" y="222" fill="#17a38c" stroke="#17a38c" stroke-width="10" stroke-linejoin="round">黑粒仔</text>
    <text x="128" y="220" fill="url(#gold)" stroke="#7a3d00" stroke-width="2" stroke-linejoin="round">黑粒仔</text>
  </g>
</svg>
</body></html>
